configuration:
  url:
    name: Solcast · Forecast URL
    description: Solcast rooftop site forecast URL. Up to 2 sites, comma-separated.
  apikey:
    name: Solcast · API key
  fronius_ip:
    name: Inverter · IP address
    description: LAN IP address of the Gen24 inverter.
  sunspec_type:
    name: Inverter · SunSpec model type
    description: Must match the inverter's Modbus SunSpec Model Type. int_sf for "int + SF", float for "float", auto to detect it.
  batt_min_soc:
    name: Inverter · Minimum SoC (%)
    description: Minimum state of charge set in the inverter's battery settings (Fronius default 5). Used by reserve horizon until_solar.
  scheduler_mode:
    name: Scheduling · Mode
    description: windows (recommended) uses the charge windows below. crontab is the legacy mode with start/end hour and crontab.
  windows:
    name: Scheduling · Charge windows
    description: Used with scheduler_mode windows. Each window is a cheap-rate period in which sbam may charge from the grid.
    fields:
      name:
        name: Name
        description: Label shown in MQTT and logs.
      start:
        name: Start
        description: HH:MM.
      end:
        name: End
        description: HH:MM. May cross midnight.
      max_charge:
        name: Max charge power (W)
        description: Maximum grid charging power in this window.
      forecast_horizon:
        name: Forecast horizon
        description: Which solar forecast the decision uses. off skips Solcast and only charges the reserve.
      consumption_horizon:
        name: Consumption horizon
        description: How daily consumption is scaled for the decision.
      tick_minutes:
        name: Tick (minutes)
        description: How often sbam re-evaluates inside the window.
      set_defaults:
        name: Defaults at window end
        description: Reset the inverter to defaults when the window ends.
      before_end_defaults_minutes:
        name: Defaults before end (minutes)
        description: Reset the inverter this many minutes before the window ends.
      weekdays:
        name: Weekdays
        description: Days the window applies, e.g. mon-fri or sat,sun. Empty means every day.
      hold_battery:
        name: Hold battery
        description: Block battery discharge in this window when no charge is needed, so the stored energy is kept for the expensive hours. PV can still charge it.
      reserve_horizon:
        name: Reserve horizon
        description: until_solar sizes the reserve from the forecast to cover the house from the window end until PV does. Empty uses the fixed battery reserve.
  pw_consumption:
    name: Consumption · Daily consumption (Wh)
    description: Household electricity use per day.
  pw_base_load:
    name: Consumption · Base load (W)
    description: House load the battery covers until PV takes over. Used by reserve horizon until_solar. 0 uses daily consumption / 24.
  pw_batt_reserve:
    name: Reserve · Battery reserve (Wh)
    description: Energy to keep in the battery, charged from the grid inside the reserve window.
  batt_reserve_start_hr:
    name: Reserve · Start hour
    description: HH:MM. Empty uses the charge window start.
  batt_reserve_end_hr:
    name: Reserve · End hour
    description: HH:MM. Empty uses the charge window end.
  pw_lwt:
    name: Charge thresholds · Lower (Wh)
    description: Hysteresis offset to stop charging.
  pw_upt:
    name: Charge thresholds · Upper (Wh)
    description: Hysteresis offset to start charging.
  grid_import_limit:
    name: Grid limit · Max import (W)
    description: Maximum import for the whole site while sbam charges from the grid, usually the contracted power. Measured on the Fronius meter. 0 disables it.
  grid_import_margin:
    name: Grid limit · Margin (W)
    description: Watts kept free under the grid import limit.
  grid_charge_priority:
    name: Grid limit · Priority
    description: Under the grid import limit, battery claims its charge and loads that throttle to the meter (EV chargers in dynamic mode) yield. loads lets the battery use only the power left free.
  start_hr:
    name: Crontab mode (legacy) · Start hour
    description: Start of the cheap grid rate, HH:MM.
  end_hr:
    name: Crontab mode (legacy) · End hour
    description: End of the cheap grid rate, HH:MM.
  crontab:
    name: Crontab mode (legacy) · Crontab
    description: Cron expression for runs in crontab mode. Deprecated, use scheduler_mode windows.
  max_charge:
    name: Crontab mode (legacy) · Max charge power (W)
    description: Maximum grid charging power.
  defaults:
    name: Crontab mode (legacy) · Defaults at end of cycle
    description: Reset the inverter to defaults at the end of the charge period.
  cache_forecast:
    name: Forecast cache · Enabled
    description: Reuse the Solcast forecast to save API calls.
  cache_time:
    name: Forecast cache · Time (s)
    description: How long a cached forecast is reused.
  cache_file_prefix:
    name: Forecast cache · File prefix
  mqtt_enabled:
    name: MQTT · Enabled
    description: Publish state to MQTT and accept commands.
  mqtt_broker:
    name: MQTT · Broker
    description: e.g. tcp://broker:1883. Empty uses the Home Assistant MQTT service.
  mqtt_client_id:
    name: MQTT · Client ID
    description: Empty generates one.
  mqtt_username:
    name: MQTT · Username
    description: Empty uses the Home Assistant MQTT service.
  mqtt_password:
    name: MQTT · Password
    description: Empty uses the Home Assistant MQTT service.
  mqtt_topic_prefix:
    name: MQTT · Topic prefix
  mqtt_ha_discovery:
    name: MQTT · Home Assistant discovery
    description: Create the sbam device and entities in Home Assistant.
  mqtt_ha_discovery_prefix:
    name: MQTT · Discovery prefix
  reset:
    name: Advanced · Reset inverter at startup
    description: Reset the inverter to defaults when the add-on starts.
  debug:
    name: Advanced · Debug logging
  log_type:
    name: Advanced · Log format
