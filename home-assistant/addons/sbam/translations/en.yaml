configuration:
  url:
    name: Solcast forecast URL
    description: Solcast rooftop site forecast URL. Up to 2 sites, comma-separated.
  apikey:
    name: Solcast API key
  fronius_ip:
    name: Fronius inverter IP
    description: LAN IP address of the Gen24 inverter.
  sunspec_type:
    name: SunSpec model type
    description: Must match the inverter's Modbus SunSpec Model Type. int_sf for "int + SF", float for "float", auto to detect it.
  batt_min_soc:
    name: Inverter minimum SoC (%)
    description: Set it to the minimum SoC in the inverter's battery settings (Fronius default 5). sbam does not read or change the inverter; it only uses this to size the until_solar reserve.
  scheduler_mode:
    name: Scheduler mode
    description: >-
      windows (recommended), crontab (legacy), or optimize. optimize plans charge, hold,
      standby and discharge every hour from Nordpool prices; the crontab and
      windows fields are ignored in that mode.
  windows:
    name: Charge windows
    description: Used with scheduler_mode windows. Each window is a cheap-rate period in which sbam may charge from the grid.
    fields:
      name:
        name: Name
        description: Label shown in MQTT and logs.
      start:
        name: Start
        description: HH:MM.
      end:
        name: End
        description: HH:MM. May cross midnight.
      max_charge:
        name: Max charge power (W)
        description: Maximum grid charging power in this window.
      forecast_horizon:
        name: Forecast horizon
        description: Which solar forecast the decision uses. off skips Solcast and only charges the reserve.
      consumption_horizon:
        name: Consumption horizon
        description: How daily consumption is scaled for the decision.
      tick_minutes:
        name: Tick (minutes)
        description: How often sbam re-evaluates inside the window.
      set_defaults:
        name: Defaults at window end
        description: Reset the inverter to defaults when the window ends.
      before_end_defaults_minutes:
        name: Defaults before end (minutes)
        description: Reset the inverter this many minutes before the window ends.
      weekdays:
        name: Weekdays
        description: Days the window applies, e.g. mon-fri or sat,sun. Empty means every day.
      hold_battery:
        name: Hold battery
        description: Block battery discharge in this window when no charge is needed, so the stored energy is kept for the expensive hours. PV can still charge it.
      reserve_horizon:
        name: Reserve horizon
        description: until_solar sizes the reserve from the forecast to cover the house from the window end until PV does. Empty uses the fixed battery reserve.
  pw_consumption:
    name: Daily consumption (Wh)
    description: Household electricity use per day.
  pw_base_load:
    name: Base load (W)
    description: House load the battery covers until PV takes over. Used by reserve horizon until_solar. 0 uses daily consumption / 24.
  pw_batt_reserve:
    name: Battery reserve (Wh)
    description: Energy to keep in the battery, charged from the grid inside the reserve window.
  batt_reserve_start_hr:
    name: Reserve start hour
    description: HH:MM. Empty uses the charge window start.
  batt_reserve_end_hr:
    name: Reserve end hour
    description: HH:MM. Empty uses the charge window end.
  pw_lwt:
    name: Lower threshold (Wh)
    description: Hysteresis offset to stop charging.
  pw_upt:
    name: Upper threshold (Wh)
    description: Hysteresis offset to start charging.
  grid_import_limit:
    name: Grid import limit (W)
    description: Maximum import for the whole site while sbam charges from the grid, usually the contracted power. Measured on the Fronius meter. 0 disables it.
  grid_import_margin:
    name: Grid import margin (W)
    description: Watts kept free under the grid import limit.
  grid_charge_priority:
    name: Grid charge priority
    description: Under the grid import limit, battery claims its charge and loads that throttle to the meter (EV chargers in dynamic mode) yield. loads lets the battery use only the power left free.
  start_hr:
    name: Start hour (crontab mode)
    description: Start of the cheap grid rate, HH:MM.
  end_hr:
    name: End hour (crontab mode)
    description: End of the cheap grid rate, HH:MM.
  crontab:
    name: Crontab (crontab mode)
    description: Cron expression for runs in crontab mode. Deprecated, use scheduler_mode windows.
  max_charge:
    name: Max charge power (W, crontab mode)
    description: Maximum grid charging power.
  defaults:
    name: Defaults at end of cycle (crontab mode)
    description: Reset the inverter to defaults at the end of the charge period.
  cache_forecast:
    name: Cache forecast
    description: Reuse the Solcast forecast to save API calls.
  cache_time:
    name: Cache time (s)
    description: How long a cached forecast is reused.
  cache_file_prefix:
    name: Cache file prefix
  mqtt_enabled:
    name: MQTT
    description: Publish state to MQTT and accept commands.
  mqtt_broker:
    name: MQTT broker
    description: e.g. tcp://broker:1883. Empty uses the Home Assistant MQTT service.
  mqtt_client_id:
    name: MQTT client ID
    description: Empty generates one.
  mqtt_username:
    name: MQTT username
    description: Empty uses the Home Assistant MQTT service.
  mqtt_password:
    name: MQTT password
    description: Empty uses the Home Assistant MQTT service.
  mqtt_topic_prefix:
    name: MQTT topic prefix
  mqtt_ha_discovery:
    name: Home Assistant discovery
    description: Create the sbam device and entities in Home Assistant.
  mqtt_ha_discovery_prefix:
    name: Discovery prefix
  reset:
    name: Reset at startup
    description: Reset the inverter to defaults when the add-on starts.
  debug:
    name: Debug logging
  log_type:
    name: Log format
  optimizer:
    name: Optimizer (scheduler_mode optimize)
    description: >-
      Options of the cost optimizer, used only with scheduler_mode optimize.
      See the optimizer documentation for the dry-run-first workflow.
    fields:
      price_entity:
        name: Nordpool price sensor
        description: >-
          Required in optimize mode. Entity ID of the Nordpool sensor (prices incl.
          VAT), e.g. sensor.nordpool_kwh_dk2_dkk_3_10_025
      consumption_entity:
        name: Household consumption sensor
        description: >-
          Required in optimize mode. Entity ID of a household load power sensor
          (W or kW), used to build the hourly consumption profile, e.g. sensor.house_load
      ev_entity:
        name: EV charger power sensor (optional)
        description: >-
          Entity ID of an EV charger power sensor (W or kW). Its load is excluded from the
          consumption profile. Leave empty if you have no EV charger.
      ev_guard_w:
        name: EV guard threshold (W)
        description: >-
          Needs the EV charger sensor. When the car draws more than this many watts
          in an hour the plan runs in self-consumption, sbam holds the battery so it
          does not discharge into the car; PV surplus still charges the battery.
          The guard releases below half the threshold, after at least 5 minutes.
          0 to 50000; default 1000. 0 disables the guard.
      purchase_surcharge:
        name: Hourly purchase surcharge (incl. VAT)
        description: >-
          Exactly 24 comma-separated values in currency/kWh incl. VAT (grid tariff,
          fees), first value = 00:00-01:00, last value = 23:00-24:00. Use '.' as
          decimal separator; each value between -5 and 10.
          Example: 0.52,0.52,0.52,0.52,0.52,0.52,0.78,...,0.52
      vat_rate:
        name: VAT rate
        description: >-
          VAT as a fraction between 0 and 1, e.g. 0.25 for 25 %.
      sell_margin:
        name: Sell margin (incl. VAT)
        description: >-
          Amount in currency/kWh incl. VAT deducted from the spot price when
          selling to the grid. Between -5 and 10; 0 if you get the plain spot price.
      min_gain:
        name: Minimum gain per hour
        description: >-
          Amount in currency per hour a charge or discharge must save compared
          with the inverter's normal self-consumption before sbam uses it. Hold
          and standby move no battery energy and need only a tenth of it.
          Smaller gains keep the inverter in self-consumption. 0 to 10; default
          0.5. 0 disables the threshold.
      wear_cost:
        name: Battery wear cost per kWh
        description: >-
          Amount in currency per kWh that a forced charge or discharge moves
          into or out of the battery, beyond what self-consumption would move.
          Added to the minimum gain, so small energy moves need a small gain and
          large ones a larger gain. 0 to 5; default 0 (off). Example: 0.15.
      battery_efficiency:
        name: Battery round-trip efficiency
        description: >-
          Fraction of the energy put into the battery that comes back out, between
          0.01 and 1. Typical value 0.83.
      max_charge_rate_w:
        name: Max battery charge rate (W)
        description: Maximum battery charge power in watts, between 1 and 30000.
      max_discharge_rate_w:
        name: Max battery discharge rate (W)
        description: >-
          Maximum power taken out of the battery in watts, between 1 and 30000.
          The inverter is sent the matching AC-side setpoint (this value times the
          square root of the battery efficiency).
      min_soc_pct:
        name: Minimum battery SoC (%)
        description: >-
          The optimizer never plans below this state of charge. Between 0 and 99.9;
          values below 5 leave almost no reserve.
      history_days:
        name: Consumption history (days)
        description: >-
          Days of recorder history used for the consumption profile, 1 to 30. Keep
          the recorder's purge_keep_days at least this high.
      dry_run:
        name: Optimizer dry run
        description: >-
          Compute and publish the plan without writing to the inverter. Keep it on
          until you have checked the plan and the inverter behaviour; turn off to go
          live.
      ha_url:
        name: Home Assistant URL (optional)
        description: >-
          Leave empty in the add-on: sbam reaches Home Assistant through the
          Supervisor automatically. Only set it to use another HA instance, e.g.
          https://homeassistant.local:8123 (requires a token).
      ha_token:
        name: Home Assistant token (optional)
        description: >-
          Long-lived access token, only needed together with the Home Assistant URL.
          Leave empty in the add-on.
