name: Deploy Docs

on:
  push:
    paths:
      - 'docs/site/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r docs/site/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Deploy preview to Surge.sh
        if: github.ref != 'refs/heads/main'
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        run: |
          BRANCH_SLUG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr -cd '[:alnum:]-')
          PREVIEW_DOMAIN="${BRANCH_SLUG}-${{ vars.SURGE_DOMAIN }}"
          PREVIEW_URL="https://${PREVIEW_DOMAIN}"
          npx surge site/ "$PREVIEW_DOMAIN" --token "$SURGE_TOKEN"
          echo "### Docs preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[${PREVIEW_URL}](${PREVIEW_URL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
