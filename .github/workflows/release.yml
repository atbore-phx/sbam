name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  determine-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine.outputs.version }}
      release: ${{ steps.determine.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine version and release type
        id: determine
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Tag detected: $VERSION"
          VERSION_FROM_FILE=$(jq -r '.version' home-assistant/addons/sbam/config.json)
          echo "Config file version: $VERSION_FROM_FILE"
          if [ "$VERSION_FROM_FILE" = "$VERSION" ]; then
            echo "Stable release detected: $VERSION"
            RELEASE=latest
          elif printf '%s\n' "$VERSION" | grep -Eq "^${VERSION_FROM_FILE}-"; then
            echo "Pre-release detected (tag has suffix after hyphen): $VERSION"
            RELEASE=pre
          else
            echo "Tag does not match stable or pre-release patterns; expected formats:"
            echo "  - Stable: vX.Y.Z (e.g. v2.0.0)"
            echo "  - Pre-release: vX.Y.Z-<suffix> (e.g. v2.0.0-alpha.1 or v2.0.0-alpha-1)"
            echo "Skipping release jobs."
            RELEASE=skip
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT

  release-ha:
    needs: determine-release
    if: ${{ needs.determine-release.outputs.release != 'skip' }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        goarch:
          - amd64
          - arm64
        goos:
          - linux
        include:
          - goarch: amd64
            haarch: amd64
            platform: linux/amd64
            runs-on: ubuntu-24.04
          - goarch: arm64
            haarch: aarch64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.determine-release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Version and release info taken from determine-release job outputs.

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: GoReleaser Install
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: GoReleaser Build ${{matrix.goos}}, ${{matrix.goarch}}
        run: |
          mkdir home-assistant/addons/sbam/bin
          goreleaser build --clean --single-target --output home-assistant/addons/sbam/bin/sbam
        env:
          GOOS: ${{matrix.goos}}
          GOARCH: ${{matrix.goarch}}
          CGO_ENABLED: 0

      - name: Build add-on image ${{ matrix.haarch }}
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.goarch }}
          image: ghcr.io/${{ github.repository_owner }}/ha-${{ matrix.haarch }}-sbam
          image-tags: |
            ${{ env.VERSION }}
            ${{ needs.determine-release.outputs.release == 'latest' && 'latest' || 'dev' }}
          version: ${{ env.VERSION }}
          context: home-assistant/addons/sbam
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: "true"
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.haarch }}-base
            PLATFORM=${{ matrix.platform }}

  release-os:
    needs: determine-release
    if: ${{ needs.determine-release.outputs.release != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
